name: Build ገንዘቤ

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If you uploaded genzebe.zip to the repo root, unpack it and build from there.
      # Otherwise the project files in the repo itself are built.
      - name: Find the project
        id: src
        run: |
          if [ -f genzebe.zip ]; then
            rm -rf _src && mkdir _src && unzip -q genzebe.zip -d _src
            dir=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
          else
            dir=.
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Building from: $dir"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Signing key
        working-directory: ${{ steps.src.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret. Using a throwaway key. Updates will not install over earlier versions. See README."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias genzebe -keyalg RSA -keysize 2048 -validity 10000 -storepass genzebe123 -keypass genzebe123 -dname "CN=Genzebe"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=genzebe123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=genzebe" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=genzebe123" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        working-directory: ${{ steps.src.outputs.dir }}
        run: gradle --no-daemon testShareDebugUnitTest

      - name: Build APKs
        working-directory: ${{ steps.src.outputs.dir }}
        run: gradle --no-daemon assembleShareRelease assembleAutoRelease

      - uses: actions/upload-artifact@v4
        with:
          name: genzebe-apks
          path: |
            ${{ steps.src.outputs.dir }}/app/build/outputs/apk/share/release/*.apk
            ${{ steps.src.outputs.dir }}/app/build/outputs/apk/auto/release/*.apk
